<!DOCTYPE html> <!-- tells the browser this is an HTML5 document -->
<html lang="en"> <!-- root element; lang="en" helps screen readers and search engines -->
<head> <!-- metadata and linked files; nothing in here shows on the page -->
<meta charset="utf-8"> <!-- character encoding so symbols and accents display correctly -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- makes the page scale properly on phones -->
<title>Colored Boxes</title> <!-- text shown in the browser tab -->
<link rel="stylesheet" href="styles.css"> <!-- connects this page to styles.css -->
</head>
<body> <!-- everything visible on the page lives in here -->
  <div class="color-grid"> <!-- the flex container; it lays out all five boxes in a row and wraps them -->
    <div class="color-box color1"></div> <!-- box 1: "color-box" gives size, "color1" gives its color (hex) -->
    <div class="color-box color2"></div> <!-- box 2: its color is written with rgb() -->
    <div class="color-box color3"></div> <!-- box 3: its color is a named color (tomato) -->
    <div class="color-box color4"></div> <!-- box 4: its color is written with hsl() -->
    <div class="color-box color5"></div> <!-- box 5: its color is written with hsla(), so it is slightly see-through -->
  </div> <!-- end of the color grid -->
</body>
</html>
