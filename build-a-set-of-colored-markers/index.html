<!DOCTYPE html> <!-- tells the browser this is an HTML5 document -->
<html lang="en"> <!-- root element; lang="en" helps screen readers and search engines -->
  <head> <!-- metadata and linked files; nothing in here shows on the page -->
    <meta charset="utf-8"> <!-- character encoding so symbols and accents display correctly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- makes the page scale properly on phones -->
    <title>Colored Markers</title> <!-- text shown in the browser tab -->
    <link rel="stylesheet" href="styles.css"> <!-- connects this page to styles.css -->
  </head>
  <body> <!-- everything visible on the page lives in here -->
    <h1>CSS Color Markers</h1> <!-- the page's one main heading; centered in the CSS -->
    <div class="container"> <!-- wrapper box that holds all three markers; gives them a white backdrop -->
      <div class="marker red"> <!-- one marker; "marker" gives shape, "red" gives its gradient (two classes, one element) -->
        <div class="cap"></div> <!-- the marker's cap; empty on purpose, the CSS draws it -->
        <div class="sleeve"></div> <!-- the translucent sleeve that sits next to the cap -->
      </div> <!-- end of the red marker -->
      <div class="marker green"> <!-- second marker; same structure, "green" gives it a different gradient -->
        <div class="cap"></div> <!-- cap -->
        <div class="sleeve"></div> <!-- sleeve -->
      </div> <!-- end of the green marker -->
      <div class="marker blue"> <!-- third marker; "blue" gradient is written with hsl() instead of rgb() or hex -->
        <div class="cap"></div> <!-- cap -->
        <div class="sleeve"></div> <!-- sleeve -->
      </div> <!-- end of the blue marker -->
    </div> <!-- end of the container -->
  </body>
</html>
